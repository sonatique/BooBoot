# BooBoot server configuration. One file per DUT: /etc/booboot/NAME.ini
# To list GPIO lines, USB-SD-Mux and serial ports: booboot-server --probe
# Comments must be on their own line.

[server]
# DUT name, shown to clients
name = dut1
host = 0.0.0.0
# With several DUTs on one board, each needs its own port.
port = 8080
log_dir = /var/log/booboot/{name}
run_dir = /run/booboot/{name}
# Idle seconds after which a session ends. Clients may ask for 1 to session_timeout_max.
session_timeout = 300
session_timeout_max = 3600
# Web page at http://HOST:PORT/ that shows the console live, read only.
web = yes

[power]
# gpio: relay driven by a GPIO line of this board
# sdmux: relay driven by GPIO 0 or 1 of the USB-SD-Mux FAST. These are open drain and
#   released (high) at mux power up: use a driver that switches on when low, active_low = yes.
# command: on_command and off_command are run by the shell
# none: no relay, the state is only recorded
backend = gpio
# Line name (see --probe), or line number together with chip (like gpiochip0)
line = GPIO17
chip =
# yes when the relay board switches on with a low input
active_low = no
sdmux_gpio = 0
on_command =
off_command =
# Seconds off during a power cycle
off_time = 2

[sdmux]
# USB serial number of the mux. Empty: the only one connected.
serial =

[console]
# auto: the only USB serial adapter. none: no console.
# With several adapters, use a /dev/serial/by-id/... path.
device = auto
baudrate = 921600
# Line ending sent after commands: cr, lf or crlf
line_ending = cr
# Default prompt regex for "run" (Python syntax)
prompt = [#$>] $
# Bytes of console output kept in memory
buffer_size = 8388608
# Number of console log files kept, one per power on
keep_logs = 100

[scripts]
# Python scripts sent by clients, run on this board: see docs/scripts.md.
# Anyone who reaches the port of this server can then run programs on this board,
# as the user below: turn them on only on a trusted network.
enabled = no
# System user for scripts only, without access to the hardware, created by install.sh.
# Its programs are stopped when a script ends.
# Scripts use the DUT through this server, in the session of the client that started them.
user = booboot-script
dir = /var/lib/booboot/{name}/scripts
# Seconds a script may run, at most (24 h)
max_time = 86400
# MB of memory for a script
memory = 512
# MB of output kept for a script: the last part
output = 10
# Size limit in MB of each file a script writes
file_size = 100
# Number of ended scripts kept, with their output and files. Older ones are deleted.
keep = 20
