name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check --select E,F,B,W --line-length 120 server client tests

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the oldest supported (Raspberry Pi OS Bullseye). 3.14 adds zstd.
        python: ["3.9", "3.11", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v

  test-root:
    # Loop devices, mounts and the simulated GPIO chip need root.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Load a simulated GPIO chip
        continue-on-error: true
        run: |
          if ! sudo modprobe gpio-mockup gpio_mockup_ranges=-1,8 gpio_mockup_named_lines; then
            sudo apt-get update
            sudo apt-get install -y "linux-modules-extra-$(uname -r)"
            sudo modprobe gpio-mockup gpio_mockup_ranges=-1,8 gpio_mockup_named_lines
          fi
          ls -l /dev/gpiochip*
      - run: sudo python3 -m unittest discover -s tests -v

  install:
    # server/install.sh on a machine with systemd, the relay on a simulated GPIO chip.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Load a simulated GPIO chip
        run: |
          sudo apt-get update
          sudo apt-get install -y "linux-modules-extra-$(uname -r)"
          sudo modprobe gpio-mockup gpio_mockup_ranges=-1,8 gpio_mockup_named_lines
      - run: sudo server/install.sh
      - name: Put the relay on the simulated GPIO chip
        run: |
          sudo sed -i 's/^line = .*/line = gpio-mockup-A-3/' /etc/booboot/dut1.ini
          sudo systemctl restart booboot@dut1
      - run: tests/check_install.sh gpio-mockup-A-3

  client:
    name: client (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -p test_client.py -v
      - run: python client/booboot.py --help

  csharp:
    # C# client and BooBoot Console against a server with a fake board.
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
      AVALONIA_TELEMETRY_OPTOUT: 1
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Start the server with a fake board
        run: |
          cd server
          nohup python3 -m booboot_server --fake --host 127.0.0.1 --port 8080 > ../server.log 2>&1 &
          for i in $(seq 20); do
            curl -sf http://127.0.0.1:8080/api/v1/status > /dev/null && exit 0
            sleep 0.5
          done
          cat ../server.log
          exit 1
      - run: dotnet run --project client/csharp/Check -- http://127.0.0.1:8080
      - run: |
          echo boot > BOOT.BIN
          dotnet run --project client/csharp/Example -- http://127.0.0.1:8080 BOOT.BIN
      - name: Fonts for the headless window
        run: fc-list | grep -qi dejavu || (sudo apt-get update && sudo apt-get install -y fonts-dejavu-core)
      - run: dotnet run --project client/csharp/BooBootConsole.Tests -- http://127.0.0.1:8080 console.png
      - name: Run the checks of BooBoot Console trimmed, like the program
        run: |
          dotnet publish client/csharp/BooBootConsole.Tests -c Release -r linux-x64 --self-contained \
            -p:PublishTrimmed=true -o publish/tests
          publish/tests/BooBootConsole.Tests http://127.0.0.1:8080
      - name: Build BooBoot Console as single files
        run: |
          for rid in win-x64 linux-x64; do
            dotnet publish client/csharp/BooBootConsole -c Release -r $rid --self-contained \
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -p:PublishTrimmed=true \
              -p:DebugType=none -o publish/$rid
          done
      - name: Start the Linux program, until it connects
        run: |
          command -v xvfb-run || (sudo apt-get update && sudo apt-get install -y xvfb)
          export XDG_CONFIG_HOME=$(mktemp -d)
          settings=$XDG_CONFIG_HOME/BooBootConsole/settings.json
          xvfb-run -a publish/linux-x64/BooBootConsole http://127.0.0.1:8080 &
          for i in $(seq 60); do
            grep -qs '"Url": "http://127.0.0.1:8080"' "$settings" && break
            sleep 0.5
          done
          sleep 2
          pgrep -x BooBootConsole
          grep '"Url": "http://127.0.0.1:8080"' "$settings"
          pkill -x BooBootConsole
      - uses: actions/upload-artifact@v7
        with:
          name: BooBootConsole-win-x64
          path: publish/win-x64/BooBootConsole.exe
          retention-days: 30
      - uses: actions/upload-artifact@v7
        with:
          name: BooBootConsole-linux-x64
          path: publish/linux-x64/BooBootConsole
          retention-days: 30
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: BooBootConsole-screenshot
          path: console.png
          if-no-files-found: ignore
          retention-days: 7
      - if: always()
        run: cat server.log

  release:
    # A tag vX.Y.Z publishes a GitHub release with the programs, once all checks pass.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, test-root, install, client, csharp]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5
      - name: Check that the tag is the version in the code
        run: |
          v=${GITHUB_REF_NAME#v}
          bad=0
          for f in server/booboot_server/__init__.py client/booboot.py client/csharp/BooBootConsole/BooBootConsole.csproj; do
            grep -Fq -e "__version__ = \"$v\"" -e "<Version>$v</Version>" "$f" || { echo "::error file=$f::version is not $v"; bad=1; }
          done
          exit $bad
      - uses: actions/download-artifact@v8
        with:
          name: BooBootConsole-win-x64
          path: build/win-x64
      - uses: actions/download-artifact@v8
        with:
          name: BooBootConsole-linux-x64
          path: build/linux-x64
      - name: Publish the release
        run: |
          mkdir dist
          cp build/win-x64/BooBootConsole.exe dist/BooBootConsole-win-x64.exe
          cp build/linux-x64/BooBootConsole dist/BooBootConsole-linux-x64
          cp client/booboot.py dist/
          (cd dist && sha256sum * > SHA256SUMS)
          # The release exists already when it was made on the GitHub page, or by an earlier run.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "BooBoot ${GITHUB_REF_NAME#v}" --generate-notes
          fi
