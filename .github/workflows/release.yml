name: Release

# Makes a release from main: all the checks of CI, then the tag vVERSION, the release and its files.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, like 1.2.3 (the tag is v1.2.3)
        required: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check the version, and that its tag is new
        run: |
          [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]] \
            || { echo "::error::version $VERSION is not like 1.2.3"; exit 1; }
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" > /dev/null 2>&1; then
            echo "::error::tag v$VERSION exists already"
            exit 1
          fi

  ci:
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
